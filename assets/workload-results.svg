  <g id="text_23">
   <text style="fill: #f2efe8; font: 700 24px 'DejaVu Sans'; text-anchor: start" x="65.52" y="41.184" transform="rotate(-0 65.52 41.184)">MiMo V2.6 Pro RL: individual workload requests</text>
  </g>
  <g id="text_24">
   <text style="fill: #abb8bd; font: 15px 'DejaVu Sans'; text-anchor: start" x="65.52" y="76.032" transform="rotate(-0 65.52 76.032)">DFlash K7 · async scheduling off · same eight DGX Sparks</text>
  </g>
  <g id="text_25">
   <text style="fill: #abb8bd; font: 11px 'DejaVu Sans'; text-anchor: start" x="65.52" y="104.544" transform="rotate(-0 65.52 104.544)">Official weights · temperature 0 · thinking off · single benchmark client</text>
  </g>
  <g id="text_26">
   <text style="fill: #edba83; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="65.52" y="134.3232" transform="rotate(-0 65.52 134.3232)">Live endpoint: background inference observed during 4/6 prose requests.</text>
  </g>
  <g id="text_27">
   <text style="fill: #abb8bd; font: 11px 'DejaVu Sans'; text-anchor: start" x="65.52" y="156.4992" transform="rotate(-0 65.52 156.4992)">These requests have different load conditions; this is not a controlled workload comparison.</text>
  </g>
  <g id="text_28">
   <text style="fill: #abb8bd; font: 10px 'DejaVu Sans'; text-anchor: start" x="65.52" y="504.9792" transform="rotate(-0 65.52 504.9792)">Each dot is one request. Two earlier extraction tasks; each prose prompt repeated twice. All requests shown.</text>
  </g>
  <g id="text_29">
   <text style="fill: #abb8bd; font: 10px 'DejaVu Sans'; text-anchor: start" x="65.52" y="532.224" transform="rotate(-0 65.52 532.224)">Rates include prefill and request overhead. Sampled peak 1 does not prove isolation. No matched native prose baseline.</text>
  </g>
  <g id="text_30">
   <text style="fill: #abb8bd; font: 10px 'DejaVu Sans'; text-anchor: start" x="65.52" y="559.4688" transform="rotate(-0 65.52 559.4688)">Sources: results/synchronous-validation.json (frozen extraction) and results/prose-throughput.json</text>
  </g>
  <g id="text_31">
   <text style="fill: #abb8bd; font: 10px 'DejaVu Sans'; text-anchor: start" x="65.52" y="605.088" transform="rotate(-0 65.52 605.088)">AEVONIX RESEARCH  /  September 2026</text>
  </g>
